# Gitea-compatible CI: lint and test on every pull request and on
# pushes to master. Runs on Gitea Actions (github.* contexts and
# actions/checkout are supported) and on GitHub Actions alike.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          set -Eeuxo pipefail
          export PATH=${HOME}/.local/bin:${PATH}
          sudo apt update
          sudo apt install -y \
             curl cppcheck libarchive-tools shellcheck
          mkdir -p ${HOME}/.local/bin
          curl -fsSL \
            https://cosmo.zip/pub/cosmocc/cosmocc-4.0.2.zip |
              bsdtar -xC ${HOME}/.local
          ln -sv ${HOME}/.local/libexec/gcc/$(uname -m)-linux-cosmo/*/* ${HOME}/.local/bin/
          base_n="${HOME}/.local/bin/$(uname -m)-linux-cosmo-"
          for f in ${base_n}* ; do
            ln -sv ${f} ${f//${base_n}/}
          done
          sudo curl -fsSLo /usr/bin/ape https://cosmo.zip/pub/cosmos/bin/ape-$(uname -m).elf
          sudo chmod -R +x /usr/bin/ape ${HOME}/.local/bin ${HOME}/.local/libexec/gcc/$(uname -m)-linux-cosmo/*/*
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' > /proc/sys/fs/binfmt_misc/register"
          sudo sh -c "echo ':APE-jart:M::jartsr::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"
          make lint
          make build
          make test
          # A short deterministic fuzz session; run the fuzz targets
          # with more runs locally for a deeper pass.
          make fuzz FUZZ_ARGS="-runs=20000 -seed=1"
